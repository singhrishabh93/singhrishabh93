name: Build README

on:
  schedule:
    - cron: "17 1 * * *" # daily, 06:47 IST: refreshes the ship log heatmap and recent blogs
  workflow_dispatch:
  push:
    paths:
      - ".readme/**"
      - ".github/workflows/readme.yml"

permissions:
  contents: write

concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      - name: Render SVG sections and README.md
        run: python .readme/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets .readme/cache
          if git diff --cached --quiet; then
            echo "README unchanged"
          else
            git commit -m "chore: refresh README"
            git push
          fi
